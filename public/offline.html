<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nexo sin conexión</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f9fe;
        color: #181c20;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(420px, 100%);
        border-radius: 24px;
        padding: 24px;
        background: #f7f9fe;
        box-shadow:
          6px 6px 16px rgba(166, 175, 195, 0.35),
          -6px -6px 16px rgba(255, 255, 255, 0.9);
      }

      h1 {
        margin: 0;
        color: #4f46e5;
        font-size: 1.5rem;
      }

      p {
        margin: 12px 0 0;
        color: #464555;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Modo sin conexión</h1>
      <p>Nexo no puede conectarse ahora. Vuelve a intentarlo cuando recuperes conexión.</p>
    </main>
  </body>
</html>
